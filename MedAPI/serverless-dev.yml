# Stage-locked config for `dev` — see serverless-prod.yml for the prod twin.
# Deploy with `sls deploy --config serverless-dev.yml`, never a bare `sls deploy`.
service: medhouse-api

frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-west-1'}
  stage: dev
  memorySize: 256
  timeout: 15
  logRetentionInDays: 30
  httpApi:
    cors: true
    # Verifies the Cognito JWT and injects its claims into
    # requestContext.authorizer.jwt.claims before the Lambda runs.
    authorizers:
      cognitoJwtAuthorizer:
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID_DEV}
        audience:
          - ${env:COGNITO_APP_CLIENT_ID_DEV}
  environment:
    NODE_ENV: production
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    # mock ships this stage on adapters/mock/ instead of real backends.
    TARGET_SOURCE: ${env:TARGET_SOURCE, 'aws'}
    # AWS_REGION is Lambda-reserved; CloudFormation rejects setting it directly.
    # dev's own Cognito pool/client — never prod's.
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID_DEV}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID_DEV}
    SUPABASE_DB_URL_SSM_PARAM: /medhouse/dev/supabase-db-url
    # HttpApi's physical id isn't known until CloudFormation creates it.
    API_BASE_URL:
      Fn::Join:
        - ''
        - - 'https://'
          - Ref: HttpApi
          - '.execute-api.'
          - Ref: 'AWS::Region'
          - '.'
          - Ref: 'AWS::URLSuffix'
  # Scoped, resource-level permissions only — no account-wide wildcards.
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - cognito-idp:SignUp
            - cognito-idp:InitiateAuth
            - cognito-idp:ForgotPassword
            - cognito-idp:ConfirmForgotPassword
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/${env:COGNITO_USER_POOL_ID_DEV}
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - arn:aws:ssm:${self:provider.region}:*:parameter/medhouse/dev/*

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node20
    exclude:
      - '@aws-sdk/*' # present in the Node 20 Lambda runtime image

# esbuild only bundles JS — copy @fastify/swagger-ui's static assets in too.
package:
  patterns:
    - 'node_modules/@fastify/swagger-ui/static/**'

functions:
  api:
    handler: src/lambda.handler
    description: MedHouse API (dev) — all HTTP routes via one Fastify app
    events:
      # Public routes — exact paths win over the authorized catch-all below.
      - httpApi:
          path: /register
          method: POST
      - httpApi:
          path: /login
          method: POST
      - httpApi:
          path: /reset-password
          method: POST
      - httpApi:
          path: /reset-password/confirm
          method: POST
      - httpApi:
          path: /health
          method: GET
      - httpApi:
          path: /docs
          method: GET
      - httpApi:
          path: /docs/{proxy+}
          method: GET
      # Everything else — requires a verified Cognito JWT.
      - httpApi:
          path: /{proxy+}
          method: '*'
          authorizer:
            name: cognitoJwtAuthorizer

plugins:
  - serverless-esbuild
